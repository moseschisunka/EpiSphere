name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: pip install -r requirements-dev.txt
      - name: Run backend tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: pytest

  migrations:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install migration dependencies
        run: pip install -r requirements-dev.txt
      - name: Run fresh Alembic migration smoke test
        env:
          DATABASE_URL: sqlite:///./ci-migration.db
        run: alembic upgrade head
      - name: Run legacy SQLite upgrade smoke test
        env:
          DATABASE_URL: sqlite:///./ci-legacy-migration.db
        run: |
          python - <<'PY'
          import sqlite3

          connection = sqlite3.connect("ci-legacy-migration.db")
          connection.execute(
              """
              CREATE TABLE diseases (
                id INTEGER PRIMARY KEY,
                name VARCHAR(255) NOT NULL,
                code VARCHAR(50),
                description TEXT,
                is_active BOOLEAN,
                created_at DATETIME
              )
              """
          )
          connection.commit()
          connection.close()
          PY
          alembic upgrade head
          python - <<'PY'
          import sqlite3

          connection = sqlite3.connect("ci-legacy-migration.db")
          columns = {row[1] for row in connection.execute("PRAGMA table_info(diseases)")}
          assert "biosafety_level" in columns
          assert connection.execute("SELECT version_num FROM alembic_version").fetchone()[0] == "0013_alert_evidence"
          PY

  migrations-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15.8-alpine
        env:
          POSTGRES_USER: episphere
          POSTGRES_PASSWORD: episphere
          POSTGRES_DB: episphere_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U episphere -d episphere_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install migration dependencies
        run: pip install -r requirements-dev.txt
      - name: Run PostgreSQL migration smoke test
        env:
          DATABASE_URL: postgresql://episphere:episphere@localhost:5432/episphere_ci
          TIMESCALEDB_ENABLED: "false"
        run: alembic upgrade head

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm ci
      - name: Type-check frontend
        run: npm run typecheck
      - name: Lint frontend
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: Run browser journey smoke tests
        run: npm run test:e2e

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Export OpenAPI contract
        working-directory: backend
        run: python scripts/export_openapi.py ../frontend/.openapi-ci.json
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Verify generated TypeScript API contract
        working-directory: frontend
        env:
          EPISPHERE_OPENAPI_URL: .openapi-ci.json
        run: |
          npm run generate:api-types
          git diff --exit-code -- lib/api.generated.ts

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        env:
          SECRET_KEY: ci-only-secret
          AGENT_API_KEY: ci-only-agent-key
          NEWS_AGENT_API_KEY: ci-only-news-key
          DATASET_AGENT_API_KEY: ci-only-dataset-key
          N8N_ENCRYPTION_KEY: ci-only-n8n-key
        run: docker compose config --quiet

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Gitleaks scans the PR commit range and needs the merge-base object.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: python -m pip install pip-audit
      - name: Audit backend dependencies
        run: pip-audit -r backend/requirements-dev.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Audit frontend dependencies
        working-directory: frontend
        run: npm ci && npm audit --audit-level=high
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
